<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yoklama QR Kodu</title>
    <meta http-equiv="refresh" content="10">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 60px;
        }
        img {
            width: 400px;
            height: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }
        h1 { font-weight: 300; }
    </style>
</head>
<body>
    <h1>Telefonunuzla QR kodu okutun</h1>
    <img src="/qr.png?ts={{ range(1, 99999) | random }}" alt="QR Kod">
    <p>Kod her 10 saniyede bir yenilenir.</p>
</body>
</html>
