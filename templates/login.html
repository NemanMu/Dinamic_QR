<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş Yap</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 36px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .icon {
            width: 56px; height: 56px; background: #eef2ff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px; font-size: 28px;
        }
        h1 { text-align: center; font-size: 22px; color: #1f2937; margin: 0 0 6px; }
        p.subtitle { text-align: center; color: #6b7280; font-size: 14px; margin: 0 0 26px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .field { margin-bottom: 16px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 13px 14px; font-size: 15px;
            border: 1.5px solid #e5e7eb; border-radius: 10px; outline: none;
        }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        button {
            width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #fff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none;
            border-radius: 10px; cursor: pointer; margin-top: 6px;
        }
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
            padding: 12px; border-radius: 10px; text-align: center; font-size: 13px;
            margin-bottom: 16px;
        }
        .switch { text-align: center; margin-top: 18px; font-size: 14px; color: #6b7280; }
        .switch a { color: #4f46e5; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Giriş Yap</h1>
        <p class="subtitle">Yoklama panelinize erişin</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label for="email">E-posta</label>
                <input type="email" id="email" name="email" placeholder="ornek@universite.edu.tr" required autofocus>
            </div>
            <div class="field">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" placeholder="Şifreniz" required>
            </div>
            <button type="submit">Giriş Yap</button>
        </form>

        <div class="switch">Hesabınız yok mu? <a href="/register">Hesap oluşturun</a></div>
    </div>
</body>
</html>
