<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Report</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto 40px; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f3f4f6; }

        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 20px 0 4px;
        }

        .topbar a {
            font-size: 13px;
            font-weight: 600;
            color: #4f46e5;
            text-decoration: none;
            border: 1.5px solid #e0e7ff;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .topbar a:hover { background: #eef2ff; }

        .topbar a.icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a class="icon-btn" href="/report/{{ session_id }}/download" title="Download">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12"></path>
                <path d="M7 10l5 5 5-5"></path>
                <path d="M5 21h14"></path>
            </svg>
        </a>
        <a href="/dashboard">Back to Profile</a>
    </div>

    <h2>Attendance Records ({{ rows|length }})</h2>
    {% if created_at %}<p style="color:#6b7280;margin-bottom:16px;">Session Date: {{ created_at }}</p>{% endif %}
    <table>
        <tr><th>Full Name</th><th>Student ID</th><th>CRN</th></tr>
        {% for full_name, student_id, crn in rows %}
        <tr><td>{{ full_name }}</td><td>{{ student_id }}</td><td>{{ crn if crn else '-' }}</td></tr>
        {% endfor %}
    </table>
</body>
</html>
